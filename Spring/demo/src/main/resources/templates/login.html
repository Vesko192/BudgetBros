<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Website Login</title>
    <link rel="stylesheet" href="styles.css">
    
</head>

<body >
    
    <div class="chase">
                <img th:src="@{/images/ChaseLogo.webp}" src="/images/ChaseLogo.webp" alt="Chase logo" width="100" height="100" />
    </div>
    <div class="login-container">
        
        <div class="logo-name">
            
            <h2>Budget Bros</h2>
            
        </div>
        
        <br>
        <h2 >login</h2>

    <form action="mainpage" method="post">
        <input type="text" name="username" id="username" placeholder="Username" required>
        <br>

        <input type="password" name="Password" id="password" placeholder="Password" required>
        <input type="checkbox" name="checkbox" id="checkbox" onclick="password.type= this.checked ? 'text' : 'password'" > <h3>Show Password</h3></input>
        <br>
        
        <button onclick="login()" type="submit">login</button>
    </form>

        <p>Don't have an account?</p>
        <form action="signUp" method="post">
            <button type="submit">Sign up</button>
        </form>



    <p id="message"></p>
    </div>

    <script src="auth.js"></script>

    

</body>
</html>
